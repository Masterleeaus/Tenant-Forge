<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">TenantForge SaaS Foundation architecture</title><desc id="desc">TenantForge routes tenant lifecycle, plans, billing and support through Laravel and Filament into a shared SQL database with tenant-aware data access and Docker/queue runtime.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17252d"/><stop offset="1" stop-color="#1b7770"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#9af0db"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#9af0db}.t{font:700 32px Segoe UI,Arial;fill:#f2fffd}.s{font:400 15px Segoe UI,Arial;fill:#d2f1ec}.n{fill:#205258;stroke:#4d9c94;stroke-width:2}.g{fill:#287b75;stroke:#9af0db;stroke-width:2}.y{fill:#3d5550;stroke:#f2c274;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#d3eee8}.q{font:400 12px Segoe UI,Arial;fill:#b9dbd5}.r{stroke:#9af0db;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">TENANTFORGE � SHARED-DATABASE TENANCY MAP</text><text x="64" y="106" class="t">Tenant lifecycle and billing stay inside a clear data boundary</text><text x="64" y="136" class="s">Source-backed from app/, database/, routes/, Filament, Stripe workflows, Docker, and tests/.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Tenant lifecycle</text><text x="195" y="290" text-anchor="middle" class="b">registration + provisioning</text><text x="195" y="318" text-anchor="middle" class="q">tenant-aware access</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Laravel + Filament</text><text x="555" y="290" text-anchor="middle" class="b">admin + tenant surfaces</text><text x="555" y="318" text-anchor="middle" class="q">policies + application services</text><path d="M680 285H790" class="r"/><rect x="790" y="220" width="250" height="130" rx="16" class="g"/><text x="915" y="260" text-anchor="middle" class="l">Plans + billing</text><text x="915" y="290" text-anchor="middle" class="b">Stripe + entitlements</text><text x="915" y="318" text-anchor="middle" class="q">subscriptions + refunds</text><path d="M1040 285H1150" class="r"/><rect x="1150" y="220" width="280" height="130" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Support + features</text><text x="1290" y="290" text-anchor="middle" class="b">tickets � profiles � plans</text><text x="1290" y="318" text-anchor="middle" class="q">tenant-scoped operations</text><path d="M1290 350V500H950" class="r"/><rect x="650" y="520" width="600" height="92" rx="16" class="n"/><text x="950" y="557" text-anchor="middle" class="l">Shared SQL database + Docker/queue runtime</text><text x="950" y="584" text-anchor="middle" class="q">application code must maintain tenant-aware boundaries</text></svg>

