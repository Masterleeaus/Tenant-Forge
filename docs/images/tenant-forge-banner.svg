<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Tenant-Forge SaaS Foundation</title><desc id="desc">A slate and teal multi-tenant SaaS banner showing tenant lifecycle, plans, billing, support, and shared database boundaries.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17252d"/><stop offset="1" stop-color="#1b7770"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 43px Segoe UI,Arial;fill:#f2fffd}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.2px;fill:#d2f1ec}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#9af0db}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#b7ded8}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#a1f0dd" opacity=".11"/><text x="70" y="66" class="e">TENANT-FORGE � MULTI-TENANT LARAVEL FOUNDATION</text><text x="70" y="125" class="t">Tenant-Forge SaaS Foundation</text><text x="72" y="160" class="s">TENANT LIFECYCLE    PLANS    BILLING    SUPPORT    SHARED SQL BOUNDARY</text><path d="M110 245H1090" stroke="#4d9c94" stroke-width="2"/><path d="M144 245H1050" stroke="#9af0db" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#225c60" stroke="#9af0db" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Tenant</text><text x="144" y="312" text-anchor="middle" class="q">onboarding + access</text><circle cx="383" cy="245" r="24" fill="#225c60" stroke="#9af0db" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Plans</text><text x="383" y="312" text-anchor="middle" class="q">features + entitlements</text><circle cx="622" cy="245" r="24" fill="#225c60" stroke="#9af0db" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Billing</text><text x="622" y="312" text-anchor="middle" class="q">Stripe + subscriptions</text><circle cx="861" cy="245" r="24" fill="#225c60" stroke="#9af0db" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="l">Support</text><text x="861" y="312" text-anchor="middle" class="q">tickets + operations</text><circle cx="1050" cy="245" r="24" fill="#3d5550" stroke="#f2c274" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Boundary</text><text x="1050" y="312" text-anchor="middle" class="q">tenant-aware data</text></g><text x="70" y="342" class="q">Derivative development retains upstream core_tenant attribution</text></svg>

